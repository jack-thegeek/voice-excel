<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
<title>语音成绩登记</title>
<style>
  :root {
    /* 颜色令牌 */
    --bg: #f5f7fb;
    --surface: #ffffff;
    --border: #e5eaf0;
    --border-strong: #d7dee8;

    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-soft: #eff6ff;

    --success: #16a34a;
    --success-soft: #f0fdf4;
    --warning: #d97706;
    --warning-soft: #fffbeb;
    --danger: #dc2626;
    --danger-hover: #b91c1c;
    --danger-soft: #fef2f2;

    --text: #1f2937;
    --text-secondary: #475569;
    --muted: #6b7280;
    --muted-soft: #94a3b8;

    /* 层级 */
    --radius: 14px;
    --radius-sm: 10px;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
    --shadow-md: 0 4px 12px rgba(16, 24, 40, .08);
    --ring: 0 0 0 3px rgba(37, 99, 235, .18);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 滚动条美化（Chrome/Edge/Safari + Firefox） ---------- */
  * {
    scrollbar-width: thin;
    scrollbar-color: #c3ccd9 #f1f5f9;
  }
  *::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }
  /* 轨道：淡色圆角槽 */
  *::-webkit-scrollbar-track {
    background: #f1f5f9;
    border-radius: 999px;
    margin: 2px;
  }
  /* 滑块：胶囊圆角 */
  *::-webkit-scrollbar-thumb {
    background: #c3ccd9;
    border-radius: 999px;
  }
  *::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  *::-webkit-scrollbar-thumb:active { background: var(--primary); }
  *::-webkit-scrollbar-corner { background: transparent; }
  /* 下拉菜单用更细的滚动条 */
  .cselect-menu::-webkit-scrollbar { width: 8px; height: 8px; }
  .cselect-menu { scrollbar-width: thin; }

  /* ---------- 布局：左控制 + 右表格，同屏可见 ---------- */
  html, body { height: 100%; }
  body { overflow: hidden; }
  .layout {
    display: grid;
    grid-template-columns: 400px 1fr;
    gap: 12px;
    align-items: stretch;
    max-width: 1320px;
    margin: 0 auto;
    padding: 12px;
    height: 100vh;
  }
  .panel-left, .panel-right { display: flex; flex-direction: column; min-height: 0; }
  .panel-left .card {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow: auto;
  }
  .panel-left .footer {
    margin-top: auto;
    padding-top: 12px;
  }
  .panel-right .card { display: flex; flex-direction: column; flex: 1; min-height: 0; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
  }
  .card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .card-title {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ---------- 表单 ---------- */
  .field-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  input[type="text"] {
    width: 100%;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 7px 10px;
    font-size: 13px;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type="text"]::placeholder { color: var(--muted-soft); }
  input[type="text"]:hover { border-color: var(--primary); }
  input[type="text"]:focus-visible {
    outline: none; border-color: var(--primary); box-shadow: var(--ring);
  }

  /* ---------- 自定义下拉 ---------- */
  .cselect { position: relative; }
  .cselect-trigger {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    height: 40px;
    padding: 0 12px;
    background: #fff;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: inherit;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    transition: border-color .15s, box-shadow .15s, background-color .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .cselect-trigger:hover { border-color: var(--primary); }
  .cselect.open .cselect-trigger,
  .cselect-trigger:focus-visible {
    outline: none;
    border-color: var(--primary);
    box-shadow: var(--ring);
  }
  .cselect-icon {
    flex: 0 0 auto;
    width: 17px;
    height: 17px;
    color: var(--muted);
  }
  .cselect-icon svg { display: block; width: 100%; height: 100%; }
  .cselect-label {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cselect-label.empty { color: var(--muted-soft); font-weight: 400; }
  .cselect-arrow {
    flex: 0 0 auto;
    width: 15px;
    height: 15px;
    color: var(--muted-soft);
    transition: transform .18s ease;
  }
  .cselect-arrow svg { display: block; width: 100%; height: 100%; }
  .cselect.open .cselect-arrow { transform: rotate(180deg); }
  .cselect-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    z-index: 30;
    max-height: 232px;
    overflow: auto;
    padding: 4px;
    margin: 0;
    list-style: none;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-md);
    visibility: hidden;
    opacity: 0;
    transform: translateY(-4px);
    pointer-events: none;
    transition: opacity .16s ease, transform .16s ease, visibility .16s;
  }
  .cselect.open .cselect-menu {
    visibility: visible;
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .cselect-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    outline: none;
    transition: background-color .12s ease;
  }
  .cselect-option:hover,
  .cselect-option.active,
  .cselect-option:focus-visible {
    background: var(--primary-soft);
    color: var(--primary-hover);
  }
  .cselect-option.selected { font-weight: 600; color: var(--primary-hover); }
  .cselect-opt-text {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cselect-check {
    flex: 0 0 auto;
    width: 14px;
    height: 14px;
    color: var(--primary);
    opacity: 0;
    transition: opacity .12s ease;
  }
  .cselect-check svg { display: block; width: 100%; height: 100%; }
  .cselect-option.selected .cselect-check { opacity: 1; }

  /* ---------- 字段提示（识别模式等） ---------- */
  .field-hint {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
  }

  /* ---------- 按钮 ---------- */
  button {
    font-family: inherit;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color .16s, transform .05s, box-shadow .16s, border-color .16s;
    -webkit-tap-highlight-color: transparent;
  }
  button:focus-visible { outline: none; box-shadow: var(--ring); }
  button:active { transform: translateY(1px); }

  .btn-pri {
    background: var(--primary); color: #fff;
    height: 38px; padding: 0 18px;
    white-space: nowrap;
    font-size: 13px;
  }
  .btn-pri:hover { background: var(--primary-hover); }

  /* 录音按钮 */
  .btn-rec {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    height: 46px;
    padding: 0 22px;
    font-size: 14px;
    color: #fff;
    border-radius: 999px;
    background: linear-gradient(135deg, #ef4444, #dc2626);
    box-shadow: 0 6px 18px rgba(220, 38, 38, .28);
  }
  .btn-rec:hover { box-shadow: 0 8px 22px rgba(220, 38, 38, .36); }
  .btn-rec .rec-icon { width: 18px; height: 18px; }
  .btn-rec .rec-icon svg { display: block; width: 100%; height: 100%; }
  .rec-dot {
    display: none;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #fff;
    flex: 0 0 auto;
  }

  .btn-rec.recording {
    background: linear-gradient(135deg, #b91c1c, #991b1b);
    box-shadow: 0 0 0 0 rgba(220, 38, 38, .5);
    animation: recRing 1.4s ease-out infinite;
  }
  .btn-rec.recording .rec-dot { display: inline-block; animation: recDot 1s ease-in-out infinite; }
  @keyframes recRing {
    0%   { box-shadow: 0 0 0 0 rgba(220, 38, 38, .45); }
    70%  { box-shadow: 0 0 0 14px rgba(220, 38, 38, 0); }
    100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
  }
  @keyframes recDot {
    0%, 100% { opacity: 1; }
    50%      { opacity: .25; }
  }

  .record-area {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    padding: 10px 0;
    margin-top: 12px;
  }
  .record-area .btn-rec { width: 100%; }
  .record-area .muted { font-size: 12px; text-align: center; min-height: 14px; }

  /* ---------- 当前录入上下文 ---------- */
  .context {
    margin-top: 12px;
    padding: 12px 14px 13px;
    background: linear-gradient(135deg, #f3f7ff, var(--primary-soft));
    border: 1px solid #dbeafe;
    border-radius: var(--radius-sm);
  }
  .context-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .context-title {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--muted);
  }
  .context-col {
    margin-top: 3px;
    font-size: 21px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .context-progress {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 9px;
  }
  .pbar {
    flex: 1;
    height: 6px;
    border-radius: 999px;
    background: #dbeafe;
    overflow: hidden;
  }
  .pfill {
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, #60a5fa, var(--primary));
    transition: width .35s ease;
  }
  .pcount {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .input-row {
    display: flex;
    gap: 8px;
    align-items: center;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .input-row input[type="text"] { flex: 1; min-width: 0; height: 38px; }

  /* ---------- 提示 ---------- */
  .tips {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tips span {
    flex: 0 0 auto;
    max-width: 100%;
    font-size: 11.5px;
    color: var(--text-secondary);
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 9px;
  }
  .tips code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    font-size: 12px;
    color: var(--primary);
    background: var(--primary-soft);
    border-radius: 5px;
    padding: 1px 5px;
    margin: 0 2px;
  }

  /* ---------- 状态 ---------- */
  .status {
    margin-top: 12px;
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    line-height: 1.55;
    border: 1px solid transparent;
    min-height: 38px;
    white-space: pre-line;
  }
  /* 状态点已移除（::before 不再使用） */
  .status.idle  { background: #f1f5f9; color: #475569; border-color: #e2e8f0; }
  .status.ok    { background: var(--success-soft); color: #15803d; border-color: #bbf7d0; }
  .status.warn  { background: var(--warning-soft); color: #b45309; border-color: #fde68a; }
  .status.err   { background: var(--danger-soft);  color: #b91c1c; border-color: #fecaca; }
  .status.busy { background: var(--primary-soft); color: #1d4ed8; border-color: #bfdbfe; }
  /* 信息区：消息 + 成绩/表达式详情（左侧统一 14px） */
  .status-info { flex: 1; min-width: 0; font-size: 14px; }
  .status-detail {
    margin-top: 2px;
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px;
  }
  /* 计算过程正常显示，结果加粗 */
  .status-detail .score { font-weight: bold; }
  .status-detail .sep   { opacity: .5; }
  .status-detail .expr  { }
  /* 成绩等级徽章：大号，固定右侧 */
  .grade-badge {
    flex: 0 0 auto;
    align-self: center;
    padding: 1px 16px;
    border-radius: 999px;
    font-size: 30px;
    font-weight: bold;
    line-height: 1.4;
    letter-spacing: 1px;
    opacity: .92;
  }

  /* ---------- 表格 ---------- */
  .scroller {
    overflow: auto;
    flex: 1;
    min-height: 0;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
    min-width: 520px;
    font-variant-numeric: tabular-nums;
  }
  thead th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: #f8fafc;
    color: var(--text-secondary);
    font-weight: 600;
    padding: 8px 10px;
    text-align: center;
    border-bottom: 1px solid var(--border-strong);
    white-space: nowrap;
  }
  tbody td {
    border-bottom: 1px solid var(--border);
    padding: 6px 10px;
    text-align: center;
    color: var(--text);
  }
  tbody tr:nth-child(even) td { background: #fafbfd; }
  tbody tr:hover td { background: #f1f5f9; }
  td.name { text-align: left; font-weight: 500; }

  td.current-col, thead th.current-col {
    background: var(--primary-soft) !important;
    color: var(--primary-hover);
    font-weight: 700;
  }
  tr.hit td { background: #dcfce7 !important; }
  tr.hit { animation: flashRow 1.6s ease-out; }
  @keyframes flashRow {
    0% { background-color: #bbf7d0 !important; }
    100% { background-color: transparent; }
  }

  /* ---------- 图例 ---------- */
  .legend {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    font-size: 12px;
    color: var(--muted);
  }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .legend .lg-col { background: var(--primary-soft); border: 1px solid #93c5fd; }
  .legend .lg-hit { background: #dcfce7; border: 1px solid #86efac; }

  /* ---------- 页脚 ---------- */
  .footer {
    margin-top: 8px;
    text-align: center;
    color: var(--muted-soft);
    font-size: 11.5px;
  }

  .muted { color: var(--muted); }

  /* ---------- 响应式 ---------- */
  @media (max-width: 860px) {
    html, body { height: auto; overflow: auto; }
    .layout {
      grid-template-columns: minmax(0, 1fr);
      height: auto;
      gap: 12px;
    }
    .panel-left, .panel-right { min-width: 0; }
    .panel-right .card { flex: none; }
    .scroller { flex: none; max-height: 50vh; }
  }
  @media (max-width: 480px) {
    .layout { padding: 8px; }
    .card { padding: 12px; }
    .input-row { flex-direction: column; align-items: stretch; }
    .input-row .btn-pri { width: 100%; }
    table { font-size: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="layout">
  <!-- 左：录入控制 -->
  <aside class="panel-left">
    <section class="card">
      <div class="card-head">
        <h2 class="card-title">录入设置</h2>
      </div>
      <div class="field-grid">
        <div class="field">
          <label id="sheetLabel" for="sheetTrigger">班级</label>
          <div class="cselect" id="sheet">
            <button class="cselect-trigger" id="sheetTrigger" type="button"
                    aria-haspopup="listbox" aria-expanded="false" aria-controls="sheetMenu" aria-labelledby="sheetLabel">
              <span class="cselect-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                  <circle cx="9" cy="7" r="4"/>
                  <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
              </span>
              <span class="cselect-label empty">请选择班级</span>
              <span class="cselect-arrow" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m6 9 6 6 6-6"/>
                </svg>
              </span>
            </button>
            <ul class="cselect-menu" id="sheetMenu" role="listbox" aria-labelledby="sheetLabel"></ul>
          </div>
        </div>
        <div class="field">
          <label id="colLabel" for="colTrigger">成绩列</label>
          <div class="cselect" id="col">
            <button class="cselect-trigger" id="colTrigger" type="button"
                    aria-haspopup="listbox" aria-expanded="false" aria-controls="colMenu" aria-labelledby="colLabel">
              <span class="cselect-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <ellipse cx="12" cy="5" rx="9" ry="3"/>
                  <path d="M3 5v14a9 3 0 0 0 18 0V5"/>
                  <path d="M3 12h18"/>
                </svg>
              </span>
              <span class="cselect-label empty">请选择成绩列</span>
              <span class="cselect-arrow" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m6 9 6 6 6-6"/>
                </svg>
              </span>
            </button>
            <ul class="cselect-menu" id="colMenu" role="listbox" aria-labelledby="colLabel"></ul>
          </div>
        </div>
        <div class="field">
          <label id="recModeLabel" for="recModeTrigger">识别模式</label>
          <div class="cselect" id="recMode">
            <button class="cselect-trigger" id="recModeTrigger" type="button"
                    aria-haspopup="listbox" aria-expanded="false" aria-controls="recModeMenu" aria-labelledby="recModeLabel">
              <span class="cselect-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17 1 21 5l-4 4"/>
                  <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                  <path d="m7 23-4-4 4-4"/>
                  <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                </svg>
              </span>
              <span class="cselect-label empty">请选择识别模式</span>
              <span class="cselect-arrow" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m6 9 6 6 6-6"/>
                </svg>
              </span>
            </button>
            <ul class="cselect-menu" id="recModeMenu" role="listbox" aria-labelledby="recModeLabel"></ul>
          </div>
          <span class="field-hint">连续识别：写入后自动继续聆听，无需重复点击录音按钮</span>
        </div>
      </div>

      <div class="context" aria-label="当前录入进度">
        <div class="context-top">
          <span class="context-title">当前录入</span>
        </div>
        <div class="context-col" id="ctxCol">—</div>
        <div class="context-progress">
          <div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="ctxBarBox">
            <div class="pfill" id="ctxBar" style="width:0%"></div>
          </div>
          <span class="pcount" id="ctxText">0 / 0 人</span>
        </div>
      </div>

      <div class="record-area">
        <button id="recBtn" class="btn-rec" type="button">
          <span class="rec-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
              <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
              <line x1="12" y1="18" x2="12" y2="22"/>
              <line x1="8" y1="22" x2="16" y2="22"/>
            </svg>
          </span>
          <span class="rec-dot" aria-hidden="true"></span>
          <span id="recLabel">语音录入</span>
        </button>
        <span id="recHint" class="muted"></span>
      </div>

      <div class="input-row">
        <input id="textInput" type="text" placeholder="例：2号 100-2-8等于几" />
        <button id="parseBtn" class="btn-pri" type="button">写入</button>
      </div>

      <div id="status" class="status idle" role="status" aria-live="polite">已就绪，可以开始录入</div>

      <div class="tips">
        <span>按「空格」开始 / 结束语音录入</span>
        <span>说「等于、等于几、等于多少」即自动结束并写入</span>
      </div>

      <div class="footer">自动保存到成绩表.xlsx</div>
    </section>
  </aside>

  <!-- 右：成绩一览 -->
  <main class="panel-right">
    <section class="card">
      <div class="card-head">
        <h2 class="card-title" id="sheetTitle">成绩表</h2>
      </div>
      <div class="scroller">
        <table id="tbl">
          <thead><tr id="thead"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="legend">
        <span><i class="lg-col"></i>当前成绩列</span>
        <span><i class="lg-hit"></i>刚写入的学生</span>
      </div>
    </section>
  </main>
</div>

<script>
const COLS = [];   // 列名
let students = [];
let currentCol = "第一单元";
let currentSheet = "";
let SHEETS = [];
let continuousMode = true;    // 是否连续识别（默认连续）
let contRestartTimer = null;  // 自动重新聆听的定时器
let manualStop = false;       // 本次是否由用户手动点击结束（手动结束时不再自动重听）

// ---------- 自定义下拉组件（ARIA listbox 模式） ----------
class CustomSelect {
  constructor(root, { placeholder = "请选择", onChange = () => {} } = {}) {
    this.root = root;
    this.trigger = root.querySelector(".cselect-trigger");
    this.label = root.querySelector(".cselect-label");
    this.menu = root.querySelector(".cselect-menu");
    this.placeholder = placeholder;
    this.onChange = onChange;
    this.options = [];
    this.value = "";

    this.trigger.addEventListener("click", () => this.toggle());
    this.trigger.addEventListener("keydown", (e) => this._onTriggerKey(e));
    // 点击下拉外部时关闭
    document.addEventListener("click", (e) => {
      if (!this.root.contains(e.target)) this.close();
    });
  }

  setOptions(options, value) {
    this.options = options || [];
    this.menu.innerHTML = "";
    this.options.forEach((opt, i) => {
      const li = document.createElement("li");
      li.className = "cselect-option";
      li.setAttribute("role", "option");
      li.setAttribute("data-value", opt);
      li.tabIndex = -1;
      const text = document.createElement("span");
      text.className = "cselect-opt-text";
      text.textContent = opt;
      const check = document.createElement("span");
      check.className = "cselect-check";
      check.setAttribute("aria-hidden", "true");
      check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></svg>';
      li.append(text, check);
      li.addEventListener("click", () => this._choose(i));
      li.addEventListener("keydown", (e) => this._onMenuKey(e, i));
      li.addEventListener("mousemove", () => this._setActive(i));
      this.menu.appendChild(li);
    });
    this._setValue(value || "", true);
  }

  getValue() { return this.value; }

  _setValue(value, silent = false) {
    this.value = value;
    const idx = this.options.indexOf(value);
    this.label.textContent = value || this.placeholder;
    this.label.classList.toggle("empty", !value);
    Array.from(this.menu.children).forEach((li, i) => {
      const sel = i === idx;
      li.classList.toggle("selected", sel);
      li.setAttribute("aria-selected", sel ? "true" : "false");
    });
    if (!silent) this.onChange(this.value);
  }

  _choose(index) {
    if (index < 0 || index >= this.options.length) return;
    const v = this.options[index];
    if (v !== this.value) this._setValue(v); // 值变化才触发 onChange
    this.close();
    this.trigger.focus();
  }

  open() {
    if (this.root.classList.contains("open")) return;
    this.root.classList.add("open");
    this.trigger.setAttribute("aria-expanded", "true");
    const idx = this.options.indexOf(this.value);
    this._setActive(idx >= 0 ? idx : 0);
    const active = this.menu.querySelector(".cselect-option.active");
    if (active) active.focus();
  }

  close() {
    if (!this.root.classList.contains("open")) return;
    this.root.classList.remove("open");
    this.trigger.setAttribute("aria-expanded", "false");
  }

  toggle() { this.root.classList.contains("open") ? this.close() : this.open(); }

  _setActive(index) {
    const items = Array.from(this.menu.children);
    if (index < 0 || index >= items.length) return;
    this.activeIndex = index;
    items.forEach((li, i) => li.classList.toggle("active", i === index));
  }

  _onTriggerKey(e) {
    const k = e.key;
    if (k === "Enter" || k === " " || k === "ArrowDown" || k === "ArrowUp") {
      e.preventDefault();
      this.open();
      const items = Array.from(this.menu.children);
      const cur = this.activeIndex;
      if (k === "ArrowDown") {
        const next = Math.min(cur + 1, items.length - 1);
        this._setActive(next);
        if (items[next]) items[next].focus();
      } else if (k === "ArrowUp") {
        const next = Math.max(cur - 1, 0);
        this._setActive(next);
        if (items[next]) items[next].focus();
      }
    } else if (k === "Escape") {
      this.close();
    }
  }

  _onMenuKey(e, index) {
    const items = Array.from(this.menu.children);
    const n = items.length;
    let next = -1;
    switch (e.key) {
      case "ArrowDown": next = (index + 1) % n; e.preventDefault(); break;
      case "ArrowUp": next = (index - 1 + n) % n; e.preventDefault(); break;
      case "Home": next = 0; e.preventDefault(); break;
      case "End": next = n - 1; e.preventDefault(); break;
      case "Enter":
      case " ": e.preventDefault(); this._choose(index); return;
      case "Escape":
        e.preventDefault(); this.close(); this.trigger.focus(); return;
      case "Tab": this.close(); return;
      default: return;
    }
    this._setActive(next);
    if (items[next]) items[next].focus();
  }
}

// 两个下拉实例：班级 / 成绩列
const sheetSel = new CustomSelect(document.getElementById("sheet"), {
  placeholder: "请选择班级",
  onChange: (v) => { currentSheet = v; renderSheetTitle(); loadStudents(); }
});
const colSel = new CustomSelect(document.getElementById("col"), {
  placeholder: "请选择成绩列",
  onChange: (v) => { currentCol = v; render(); }
});

// ---------- 识别模式（单次 / 连续） ----------
const REC_MODES = ["单次识别", "连续识别"];
const recModeSel = new CustomSelect(document.getElementById("recMode"), {
  placeholder: "请选择识别模式",
  onChange: (v) => {
    continuousMode = v === "连续识别";
    try { localStorage.setItem("voiceExcel.continuous", continuousMode ? "1" : "0"); } catch(e) {}
    if (!continuousMode) { clearTimeout(contRestartTimer); }
  }
});
// 恢复上次选择的模式；未保存过时默认连续识别
let savedMode = null;
try { savedMode = localStorage.getItem("voiceExcel.continuous"); } catch(e) {}
continuousMode = savedMode === null ? true : savedMode === "1";
recModeSel.setOptions(REC_MODES, continuousMode ? "连续识别" : "单次识别");

// 一次语音录入结束后（无论写入成功或失败），若开启连续识别则自动重新开始聆听
function scheduleContinuousRestart() {
  if (!continuousMode) return;
  clearTimeout(contRestartTimer);
  contRestartTimer = setTimeout(() => {
    if (!recognizing && continuousMode) startAsr();
  }, 1000);
}

// 表格标题 = 当前选中的 Excel sheet 名
function renderSheetTitle() {
  const el = document.getElementById("sheetTitle");
  if (el) el.textContent = currentSheet || "成绩表";
}

// ---------- 初始化 ----------
async function init() {
  const r = await fetch("/api/students");
  const d = await r.json();
  SHEETS = d.sheets || [];
  currentSheet = d.sheet;
  sheetSel.setOptions(SHEETS, currentSheet);
  COLS.length = 0;
  COLS.push(...d.cols);
  currentCol = d.default_col;
  colSel.setOptions(COLS, currentCol);
  students = d.students;
  renderSheetTitle();
  render();
}

// 切换班级时只重载学生，不动列
async function loadStudents() {
  setStatus("busy", "正在加载班级…");
  try {
    const r = await fetch(`/api/students?sheet=${encodeURIComponent(currentSheet)}`);
    const d = await r.json();
    if (!r.ok) { setStatus("err", d.detail || "加载失败"); return; }
    students = d.students;
    render();
    setStatus("idle", "已就绪，可以开始录入");
  } catch(e) { setStatus("err", "网络错误：" + e.message); }
}

function render(highlightSeq) {
  const thead = document.getElementById("thead");
  const tbody = document.getElementById("tbody");
  thead.innerHTML = "";
  ["序号","姓名",...COLS].forEach((c, idx) => {
    const th = document.createElement("th"); th.textContent = c;
    if (idx >= 2 && COLS[idx - 2] === currentCol) th.classList.add("current-col");
    thead.appendChild(th);
  });
  tbody.innerHTML = "";
  students.forEach(s => {
    const tr = document.createElement("tr");
    if (s.seq === highlightSeq) tr.classList.add("hit");
    let html = `<td>${s.seq}</td><td class="name">${s.name}</td>`;
    COLS.forEach(c => {
      const v = s.scores[c] ?? "";
      const cls = (c === currentCol) ? ' class="current-col"' : "";
      html += `<td${cls}>${v}</td>`;
    });
    tr.innerHTML = html;
    tbody.appendChild(tr);
  });
  // 自动滚动到高亮行
  if (highlightSeq != null) {
    const hit = tbody.querySelector("tr.hit");
    if (hit) hit.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  updateContext();
}

// 更新左栏「当前录入」上下文卡：班级、成绩列、该列已录入进度
function updateContext() {
  const col = document.getElementById("ctxCol");
  if (col) col.textContent = currentCol || "—";
  const total = students.length;
  let filled = 0;
  students.forEach(s => {
    const v = s.scores[currentCol];
    if (v !== undefined && v !== null && String(v).trim() !== "") filled++;
  });
  const pct = total ? Math.round(filled / total * 100) : 0;
  const bar = document.getElementById("ctxBar");
  const text = document.getElementById("ctxText");
  const box = document.getElementById("ctxBarBox");
  if (bar) bar.style.width = pct + "%";
  if (text) text.textContent = `已录入 ${filled} / ${total} 人`;
  if (box) {
    box.setAttribute("aria-valuenow", pct);
    box.setAttribute("aria-valuetext", `${filled} / ${total} 人`);
  }
}

// 分数 -> 等级映射
// 90≤score≤100:A+ / 85≤score<90:A / 75≤score<85:B+ / 60≤score<75:B / score<60:C
function gradeOf(score) {
  const n = Number(score);
  if (!Number.isFinite(n)) return "";
  if (n >= 90) return "A+";
  if (n >= 85) return "A";
  if (n >= 75) return "B+";
  if (n >= 60) return "B";
  return "C";
}

function setStatus(cls, msg, detail) {
  const el = document.getElementById("status");
  el.className = "status " + cls;
  el.textContent = "";

  // 左侧信息区：主消息 + 成绩/表达式详情
  const info = document.createElement("div");
  info.className = "status-info";

  const text = document.createElement("div");
  text.className = "status-text";
  text.textContent = msg;
  info.appendChild(text);

  if (detail && detail.score !== undefined && detail.score !== null && String(detail.score).trim() !== "") {
    const row = document.createElement("div");
    row.className = "status-detail";

    // 计算过程（直接设定时无算式，仅提示文字）
    if (detail.expr) {
      const expr = document.createElement("span");
      expr.className = "expr";
      expr.textContent = detail.expr;
      row.appendChild(expr);

      const sep = document.createElement("span");
      sep.className = "sep";
      sep.textContent = detail.expr === "直接设定" ? " " : " = ";
      row.appendChild(sep);
    }

    // 结果加粗
    const score = document.createElement("span");
    score.className = "score";
    score.textContent = detail.score;
    row.appendChild(score);

    info.appendChild(row);
  }
  el.appendChild(info);

  // 右侧大号等级徽章
  if (detail && detail.grade) {
    const badge = document.createElement("span");
    badge.className = "grade-badge";
    badge.textContent = detail.grade;
    el.appendChild(badge);
  }
}

// ---------- 解析 + 直接写入 ----------
let pendingScore = null;
let pendingSeq = null;

async function doParse(text) {
  if (!text || !text.trim()) { setStatus("warn","请先录音或输入内容。"); return; }
  setStatus("busy","正在识别内容…");
  try {
    const r = await fetch("/api/parse", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ text, col_name: currentCol })
    });
    const d = await r.json();
    if (!r.ok) { setStatus("err", d.detail || "内容无法识别"); return; }
    // 解析成功：找不到学生 -> 报错；否则直接写入
    if (!d.student_found) {
      setStatus("warn", `找不到 ${d.seq} 号学生，请确认序号后再试`, {
        score: d.score,
        expr: d.is_direct ? "直接设定" : d.expression,
        grade: gradeOf(d.score)
      });
      render(d.seq);
      return;
    }
    await doApply(d);
  } catch(e) { setStatus("err","网络错误：" + e.message); }
}

async function doApply(d) {
  pendingScore = d.score; pendingSeq = d.seq;
  const detail = {
    score: d.score,
    expr: d.is_direct ? "直接设定" : d.expression,
    grade: gradeOf(d.score)
  };
  setStatus("busy", `正在写入：${d.seq}号 ${d.student.name}「${currentCol}」`, detail);
  try {
    const r = await fetch("/api/apply", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ seq: d.seq, col_name: currentCol, score: d.score, sheet_name: currentSheet })
    });
    const dd = await r.json();
    if (!r.ok) { setStatus("err", dd.detail || "写入失败"); return; }
    // 更新本地
    const i = students.findIndex(s => s.seq === d.seq);
    if (i >= 0) students[i] = dd.student;
    render(d.seq);
    detail.score = dd.student.scores[currentCol];
    detail.grade = gradeOf(detail.score);
    setStatus("ok", `${d.seq}号 ${dd.student.name}「${currentCol}」`, detail);
  } catch(e) { setStatus("err","网络错误：" + e.message); }
}

// ---------- 语音识别（FunASR WebSocket 流式） ----------
const recBtn = document.getElementById("recBtn");
const recHint = document.getElementById("recHint");
let recognizing = false;
// 收尾关键词：语音中出现其一即自动结束并写入
// 说明：「等于」已覆盖「等于几/等于多少/等于啥」；其余为与 parser 同样支持的收尾说法
const TRIGGERS = ["等于", "等于几", "等于多少", "等于啥", "得多少", "得几", "是多少", "是几"];

let wsCtx = null;          // AudioContext
let wsStream = null;       // MediaStream
let wsProc = null;         // ScriptProcessor
let wsSrc = null;          // MediaStreamSource
let asrWs = null;          // WebSocket
let asrReady = false;      // 模型是否就绪
let accumulated = "";      // 服务端返回的累计增量文本

// 浏览器重采样到 16kHz（线性插值）
function downsample(buffer, inRate) {
  if (inRate === 16000) return buffer;
  const ratio = inRate / 16000;
  const outLen = Math.floor(buffer.length / ratio);
  const out = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const idx = i * ratio;
    const lo = Math.floor(idx);
    const hi = Math.min(lo + 1, buffer.length - 1);
    const frac = idx - lo;
    out[i] = buffer[lo] * (1 - frac) + buffer[hi] * frac;
  }
  return out;
}
// Float32 [-1,1] -> Int16 PCM
function floatTo16(buffer) {
  const out = new Int16Array(buffer.length);
  for (let i = 0; i < buffer.length; i++) {
    let s = Math.max(-1, Math.min(1, buffer[i]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return out;
}

function stopMic() {
  try { if (wsProc) wsProc.disconnect(); } catch(e) {}
  try { if (wsSrc) wsSrc.disconnect(); } catch(e) {}
  if (wsStream) wsStream.getTracks().forEach(t => t.stop());
  if (wsCtx) { try { wsCtx.close(); } catch(e) {} }
  wsProc = wsSrc = wsStream = wsCtx = null;
}

function setRecognizing(on) {
  recognizing = on;
  const label = document.getElementById("recLabel");
  if (on) {
    recBtn.classList.add("recording");
    label.textContent = "正在聆听… 点击结束";
    recHint.textContent = "";
  } else {
    recBtn.classList.remove("recording");
    label.textContent = "语音录入";
    recHint.textContent = "";
  }
}

async function startAsr() {
  if (recognizing) return;
  manualStop = false;   // 新一轮监听，重置手动结束标记
  accumulated = "";
  document.getElementById("textInput").value = "";
  setStatus("busy", "正在连接语音识别服务…");
  // 建 WebSocket
  const proto = location.protocol === "https:" ? "wss" : "ws";
  asrWs = new WebSocket(`${proto}://${location.host}/ws/asr`);
  asrWs.binaryType = "arraybuffer";

  let micStarted = false;
  asrWs.onmessage = async (ev) => {
    let d;
    try { d = JSON.parse(ev.data); } catch(e) { return; }
    if (d.status === "ready") {
      asrReady = true;
      // 启动麦克风
      try {
        await startMic();
        micStarted = true;
        setRecognizing(true);
        setStatus("busy", "正在聆听，请说出「序号 + 算式 + 等于几」…");
      } catch(e) {
        setStatus("err", "麦克风启动失败：" + e.message);
        try { asrWs.send(JSON.stringify({action:"stop"})); } catch(e) {}
      }
      return;
    }
    if (d.status === "loading") { setStatus("busy", "语音识别模型首次加载中，约 10-30 秒，请稍候…"); return; }
    if (d.status === "done") {
      setRecognizing(false);
      stopMic();
      const all = document.getElementById("textInput").value;
      if (all) {
        await doParse(all);
        if (!manualStop) scheduleContinuousRestart();
      }
      manualStop = false;
      return;
    }
    if (d.error) {
      setStatus("err", "识别出错：" + d.error);
      setRecognizing(false);
      stopMic();
      return;
    }
    // 增量文本
    if (typeof d.text === "string" && d.text) {
      accumulated += d.text;
      const inp = document.getElementById("textInput");
      inp.value = accumulated;
      normalizeHao(inp);
      if (TRIGGERS.some(k => accumulated.includes(k))) {
        // 触发结束
        try { asrWs.send(JSON.stringify({action:"stop"})); } catch(e) {}
      }
    }
  };
  asrWs.onerror = () => {
    setStatus("err", "连接语音识别服务失败");
    setRecognizing(false);
    stopMic();
  };
  asrWs.onclose = () => {
    if (recognizing) {
      setRecognizing(false);
      stopMic();
    }
  };
}

async function startMic() {
  wsStream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
  });
  wsCtx = new (window.AudioContext || window.webkitAudioContext)();
  await wsCtx.resume();
  wsSrc = wsCtx.createMediaStreamSource(wsStream);
  // ScriptProcessor 4096 帧，触发回调时取数据
  wsProc = wsCtx.createScriptProcessor(4096, 1, 1);
  wsProc.onaudioprocess = (e) => {
    if (!asrWs || asrWs.readyState !== 1) return;
    const ch0 = e.inputBuffer.getChannelData(0);
    const ds = downsample(ch0, wsCtx.sampleRate);
    const i16 = floatTo16(ds);
    // 不满一个 chunk 也直接发，后端会累积
    asrWs.send(i16.buffer);
  };
  wsSrc.connect(wsProc);
  wsProc.connect(wsCtx.destination); // 必须 connect 才会触发 onaudioprocess
}

// 切换录音：正在聆听则手动结束，否则开始聆听
function toggleRecording() {
  if (recognizing) {
    // 手动停止：发 stop 让后端 flush；标记为手动结束，之后不再自动重听
    manualStop = true;
    try { asrWs && asrWs.send(JSON.stringify({action:"stop"})); } catch(e) {}
    return;
  }
  startAsr();
}
recBtn.onclick = toggleRecording;

// 空格键快捷录音：焦点不在输入框/按钮/下拉等交互控件上时，按空格开始或结束聆听
document.addEventListener("keydown", (e) => {
  if (e.code !== "Space" && e.key !== " ") return;
  const t = e.target;
  if (t && t.closest && t.closest("input, textarea, select, button, .cselect, [contenteditable]")) return;
  e.preventDefault(); // 避免触发页面滚动等默认行为
  toggleRecording();
});

document.getElementById("parseBtn").onclick = () => doParse(document.getElementById("textInput").value);

// 在"号"后自动插入逗号分隔（输入框 & 语音结果）
const SEPARATORS = "，,。、；;！!？? \t";
function normalizeHao(input) {
  let v = input.value;
  if (!v) return;
  let pos = input.selectionStart || v.length;
  let out = "";
  for (let i = 0; i < v.length; i++) {
    out += v[i];
    if (v[i] === "号") {
      const next = v[i + 1];
      if (next === undefined || !SEPARATORS.includes(next)) {
        out += "，";
        if (i + 1 <= pos) pos += 1; // 光标在插入点之前，同步后移
      }
    }
  }
  if (out !== v) {
    input.value = out;
    try { input.setSelectionRange(pos, pos); } catch (e) {}
  }
}
const textInputEl = document.getElementById("textInput");
textInputEl.addEventListener("input", () => normalizeHao(textInputEl));
textInputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") doParse(e.target.value);
});

init();
</script>
